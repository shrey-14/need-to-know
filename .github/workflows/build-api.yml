# Builds the API image on GitHub's amd64 runners and pushes it to GitHub
# Container Registry (ghcr.io), where Azure Container Apps pulls it from.
#
# Why here and not `az acr build`: Azure for Students subscriptions don't allow
# ACR Tasks, and a local build on Apple Silicon would produce arm64, which
# Azure doesn't run. The default GITHUB_TOKEN can push to ghcr.io, so no
# secrets are needed.
name: Build API image

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "data/**"
      - "users/**"
      - "infra/Dockerfile.api"
      - "pyproject.toml"
      - ".dockerignore"
      - ".github/workflows/build-api.yml"
  workflow_dispatch: {} # run manually from the Actions tab

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/finsolve-api

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Reuse the torch/dependency layers between runs; only changed
          # layers (code, data, index) rebuild.
          cache-from: type=gha
          cache-to: type=gha,mode=max
