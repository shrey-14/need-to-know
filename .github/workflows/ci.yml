# CI: runs on every push to main and every pull request. No secrets and no
# LLM calls, so it's free to run and safe on forks.
#
#   backend:  builds the real index, then
#             - unit tests (access control at retrieval, auth, PII, access map)
#             - every eval evidence string is still reachable in the index
#             - retrieval quality gate: Tier 1 evidence recall must stay >= 0.78
#               (EXP-003 measured 0.812; the margin absorbs one row's worth of
#               numerical drift between machines, not a real regression)
#   frontend: citation-parser / decline-detection tests, then type-check + build
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-base-en-v1.5

      - name: Build the index
        run: python -m app.ingestion.build_index

      - name: Unit tests
        run: pytest -q

      - name: Eval evidence is reachable in the index
        run: python -m eval.retrieval_check --validate

      - name: Retrieval quality gate
        run: python -m eval.retrieval_check --min-recall 0.78 --no-save

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build
