[project]
name = "rag-chatbot-rbac"
version = "0.1.0"
description = "Internal RAG chatbot with role-based access control, guardrails, evals, and monitoring"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "langchain>=0.3",
    "langchain-community>=0.3,<0.4",
    "langchain-groq>=0.2",
    "langchain-chroma>=0.1",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pandas>=2.2",
    "ragas>=0.2",
    "langsmith>=0.1",
    "langchain-huggingface>=1.2.2",
    "python-dotenv>=1.2.3",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
